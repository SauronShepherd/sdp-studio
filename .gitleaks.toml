title = "SDP Studio Gitleaks configuration"

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

  [[rules.allowlists]]
  description = "Synthetic SDP Studio signing keys in storage API tests"
  regexTarget = "line"
  regexes = [
    '''SDPSTUDIO_AUTH_SIGNING_KEY.*rbac-signing-key-123456''',
    '''SDPSTUDIO_AUTH_SIGNING_KEY.*rbac-ws-signing-key-123''',
  ]
