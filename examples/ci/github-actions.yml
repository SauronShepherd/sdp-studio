name: SDP Studio validation

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install SDP Studio
        run: python -m pip install "sdpstudio[dev]"
      - name: Validate generated source
        run: sdpstudio validate "$SDPSTUDIO_PROJECT_ID"
        env:
          SDPSTUDIO_PROJECT_ID: ${{ vars.SDPSTUDIO_PROJECT_ID }}
      - name: Check generated files
        run: sdpstudio generate "$SDPSTUDIO_PROJECT_ID" --check
        env:
          SDPSTUDIO_PROJECT_ID: ${{ vars.SDPSTUDIO_PROJECT_ID }}
