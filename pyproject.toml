[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sdpstudio"
version = "0.1.0"
description = "Open-source visual IDE for Apache Spark Declarative Pipelines"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{name = "SDP Studio contributors"}]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.32,<1",
  "pydantic>=2.10,<3",
  "PyYAML>=6,<7",
  "SQLAlchemy>=2.0,<3",
  "aiosqlite>=0.20,<1",
  "cryptography>=43,<48",
  "argon2-cffi>=23,<26",
  "sqlglot>=30,<31",
  "pycrdt>=0.14,<0.15",
  "alembic>=1.14,<2",
]

[project.optional-dependencies]
pipelines = ["pyspark[pipelines]>=4.2,<4.3"]
connect = [
  "pyspark[pipelines]>=4.2,<4.3",
  "pyarrow>=15",
  "grpcio>=1.48.1",
  "grpcio-status>=1.48.1",
  "zstandard>=0.25",
]
postgres = ["asyncpg>=0.29,<1", "psycopg[binary]>=3.2,<4"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "coverage[toml]>=7.6", "httpx>=0.27", "ruff>=0.8", "alembic>=1.14,<2", "mypy>=1.13,<2", "types-PyYAML>=6.0"]
databricks = ["databricks-sdk>=0.36,<1"]
observability = ["opentelemetry-api>=1.27,<2", "opentelemetry-sdk>=1.27,<2", "opentelemetry-instrumentation-fastapi>=0.48b0,<1"]
collaboration = []

[project.scripts]
sdpstudio = "sdpstudio_cli.main:main"

[tool.setuptools]
package-dir = {"" = "python"}
packages = ["sdpstudio_core", "sdpstudio_codegen", "sdpstudio_runners", "sdpstudio_server", "sdpstudio_cli", "sdpstudio_adapters_databricks"]
include-package-data = true

[tool.setuptools.package-data]
sdpstudio_server = ["static/*", "static/react/*", "static/react/assets/*", "examples/retail-etl/*", "examples/retail-etl/.sdpstudio/pipelines/*", "examples/retail-etl/data/*"]

[tool.pytest.ini_options]
pythonpath = ["python"]
testpaths = ["tests"]
addopts = "-q"
markers = ["databricks_live: optional qualification requiring a configured Databricks workspace"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/golden/*.py" = ["F821"]

[tool.mypy]
python_version = "3.12"
files = ["python"]
ignore_missing_imports = true
follow_imports = "normal"
warn_unused_ignores = true
