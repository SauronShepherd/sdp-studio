name: scratch-oidc-route-g1-v2

on:
  push:
    branches: [scratch/2026-09-12-oidc-route-g1]

permissions:
  contents: write

jobs:
  test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - name: Qualify focused OIDC route test
        run: |
          ruff check --fix --select I001 tests/test_oidc_route_authorization.py
          ruff format tests/test_oidc_route_authorization.py
          ruff check tests/test_oidc_route_authorization.py
          ruff format --check tests/test_oidc_route_authorization.py
          pytest -q tests/test_oidc_route_authorization.py
      - name: Commit validated test tree
        run: |
          rm .github/workflows/scratch-oidc-route-g1.yml .github/workflows/scratch-oidc-route-g1-v2.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "test: qualify immutable OIDC callback authorization"
          git push origin HEAD:scratch/2026-09-12-oidc-route-g1
