name: Kubernetes qualification

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * 1"

jobs:
  kind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1
        with:
          cluster_name: sdpstudio
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Create qualification namespace and service account
        run: |
          kubectl create namespace sdpstudio-qualification
          kubectl -n sdpstudio-qualification create serviceaccount sdpstudio-driver
          kubectl -n sdpstudio-qualification auth can-i get pods --as=system:serviceaccount:sdpstudio-qualification:sdpstudio-driver
      - name: Run Kubernetes contract qualification
        run: python scripts/qualify.py --kubernetes --output dist/kubernetes-qualification.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kubernetes-qualification
          path: dist/kubernetes-qualification.json
