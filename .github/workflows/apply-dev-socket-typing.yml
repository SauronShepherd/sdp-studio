name: Apply typed development socket routing

on:
  push:
    branches:
      - autopilot-pytest-hang-20260902

permissions:
  contents: write

jobs:
  patch-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/patch_dev_socket_typing.py
      - name: Verify development socket routing
        run: |
          grep -q 'developmentSocket = window.location.port === "8787"' web/src/main.tsx
          grep -q 'window.location.hostname}:8788' web/src/main.tsx
          ! grep -q 'import.meta.env.DEV' web/src/main.tsx
      - name: Commit product patch and remove helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/src/main.tsx
          git rm .github/scripts/patch_dev_socket_typing.py .github/workflows/apply-dev-socket-typing.yml
          git commit -m 'fix: type development websocket routing'
          git push origin HEAD:autopilot-pytest-hang-20260902
