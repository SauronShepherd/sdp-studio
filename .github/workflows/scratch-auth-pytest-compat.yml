name: scratch-auth-pytest-compat

on:
  push:
    branches: [scratch/2026-09-12-auth-pytest-compat]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - name: Apply secure compatibility fixes
        shell: python
        run: |
          from pathlib import Path

          app = Path('python/sdpstudio_server/app.py')
          text = app.read_text(encoding='utf-8')
          old = '    request: Request, minimum: str, *, auth_required: bool\n) -> None:\n'
          new = '    request: Request, minimum: str, *, auth_required: bool = True\n) -> None:\n'
          assert text.count(old) == 1
          app.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')

          test = Path('tests/test_storage_api.py')
          text = test.read_text(encoding='utf-8')
          old = '''    token = "team-secret-token"\n    monkeypatch.setenv("SDPSTUDIO_AUTH_TOKEN", token)\n    client = TestClient(create_app(tmp_path))\n    headers = {"Authorization": f"Bearer {token}"}\n    project = client.post("/api/projects", json={"name": "secure-collab"}, headers=headers).json()\n'''
          new = '''    token = "team-secret-token"\n    monkeypatch.setenv("SDPSTUDIO_AUTH_TOKEN", token)\n    monkeypatch.setenv("SDPSTUDIO_AUTH_SIGNING_KEY", "ws-auth-signing-key-123456")\n    monkeypatch.setenv("SDPSTUDIO_ADMIN_PASSWORD", "admin-development-password")\n    client = TestClient(create_app(tmp_path))\n    login = client.post(\n        "/api/auth/login",\n        json={"username": "admin", "password": "admin-development-password"},\n    )\n    assert login.status_code == 200\n    csrf = client.cookies.get("sdpstudio_csrf")\n    assert csrf\n    project_response = client.post(\n        "/api/projects",\n        json={"name": "secure-collab"},\n        headers={"x-csrf-token": csrf},\n    )\n    assert project_response.status_code == 200\n    project = project_response.json()\n'''
          assert text.count(old) == 1
          test.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
      - name: Validate focused regressions
        run: |
          ruff check python/sdpstudio_server/app.py tests/test_auth.py tests/test_storage_api.py
          ruff format --check python/sdpstudio_server/app.py tests/test_auth.py tests/test_storage_api.py
          mypy
          pytest -q tests/test_auth.py::test_role_claims_are_ordered tests/test_storage_api.py::test_websocket_auth_uses_subprotocol_not_query_string tests/test_auth_live_wiring.py
      - name: Commit candidate
        run: |
          rm .github/workflows/scratch-auth-pytest-compat.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "test: align auth regressions with fail-closed roles"
          git push origin HEAD:scratch/2026-09-12-auth-pytest-compat
