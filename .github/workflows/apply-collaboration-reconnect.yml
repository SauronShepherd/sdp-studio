name: Apply collaboration reconnect

on:
  push:
    branches:
      - autopilot-pytest-hang-20260902

permissions:
  contents: write

jobs:
  patch-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply deterministic client patch
        run: python .github/scripts/patch_collaboration_reconnect.py
      - name: Verify patched client compiles structurally
        run: |
          grep -q 'reconnectDelay = 250' web/src/main.tsx
          grep -q 'event.code === 4401 || event.code === 4404' web/src/main.tsx
          grep -q 'Math.max(0, message.count - 1)' web/src/main.tsx
      - name: Commit product patch and remove one-shot helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/src/main.tsx
          git rm .github/scripts/patch_collaboration_reconnect.py .github/workflows/apply-collaboration-reconnect.yml
          git commit -m 'fix: reconnect collaboration websocket safely'
          git push origin HEAD:autopilot-pytest-hang-20260902
