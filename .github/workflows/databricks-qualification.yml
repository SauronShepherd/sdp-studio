name: Optional Databricks qualification

on:
  workflow_dispatch:

jobs:
  databricks-live:
    runs-on: ubuntu-latest
    env:
      SDPSTUDIO_DATABRICKS_WORKSPACE_URL: ${{ secrets.SDPSTUDIO_DATABRICKS_WORKSPACE_URL }}
      SDPSTUDIO_DATABRICKS_TOKEN: ${{ secrets.SDPSTUDIO_DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Databricks credentials
        id: credentials
        shell: bash
        run: |
          if [ -n "$SDPSTUDIO_DATABRICKS_WORKSPACE_URL" ] && [ -n "$SDPSTUDIO_DATABRICKS_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Databricks qualification skipped: required repository secrets are not configured."
          fi
      - name: Install qualification dependencies
        if: steps.credentials.outputs.available == 'true'
        run: pip install -e '.[dev,databricks]'
      - name: Run live provider qualification
        if: steps.credentials.outputs.available == 'true'
        run: pytest -m databricks_live tests/test_databricks_live.py
