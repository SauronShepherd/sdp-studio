name: scratch-auth-live-wiring-v2

on:
  push:
    branches: [scratch/2026-09-12-auth-live-wiring]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply bounded patch
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('python/sdpstudio_server/app.py')
          s = p.read_text(encoding='utf-8')

          def one(pattern, repl, *, flags=0):
              global s
              s2, n = re.subn(pattern, repl, s, count=1, flags=flags)
              assert n == 1, f'expected one match for {pattern[:80]!r}, got {n}'
              s = s2

          one(r'from \.auth_bootstrap import AuthBootstrapService\n',
              'from .auth_bootstrap import AuthBootstrapService\nfrom .auth_policy import role_allowed, websocket_auth_required\nfrom .external_principals import (\n    ExternalPrincipalAuthorizationError,\n    ExternalPrincipalStore,\n)\n')
          one(r'(from \.oidc import \(.*?\n\))\n', r'\1\nfrom .oidc_authorization import authorize_oidc_principal\n', flags=re.S)

          one(
              r'def _require_role\(request: Request, minimum: str\) -> None:\n.*?\n\n(?=def _audit_actor)',
              '''def _require_role(\n    request: Request, minimum: str, *, auth_required: bool\n) -> None:\n    identity = getattr(request.state, "identity", None)\n    if not role_allowed(identity, minimum, auth_required=auth_required):\n        raise HTTPException(\n            status_code=403,\n            detail={\n                "code": "SDPS-AUTH-ROLE_REQUIRED",\n                "message": f"Role '{minimum}' or higher is required",\n                "required_role": minimum,\n            },\n        )\n\n\n''', flags=re.S)
          calls = re.findall(r'_require_role\(request, ("(?:viewer|editor|admin)")\)', s)
          assert len(calls) >= 4, f'expected route role calls, got {len(calls)}'
          s = re.sub(r'_require_role\(request, ("(?:viewer|editor|admin)")\)',
                     r'_require_role(request, \1, auth_required=auth_required)', s)
          assert not re.search(r'_require_role\(request, "(?:viewer|editor|admin)"\)', s)

          one(
              r'def _websocket_authorized\(\n    ws: WebSocket, expected: str \| None, auth_service: AuthService \| None = None\n\) -> bool:\n.*?\n\n(?=def _websocket_subprotocol)',
              '''def _websocket_authorized(\n    ws: WebSocket, expected: str | None, auth_service: AuthService | None = None\n) -> bool:\n    if not websocket_auth_required(\n        expected, auth_service_present=auth_service is not None\n    ):\n        return True\n    for protocol in _websocket_protocols(ws):\n        if expected and hmac.compare_digest(protocol, expected):\n            return True\n        if protocol.startswith("sdpstudio.auth.") and auth_service:\n            token = protocol[len("sdpstudio.auth.") :]\n            if auth_service.verify(token) is not None:\n                return True\n    return False\n\n\n''', flags=re.S)

          cors = '''    app.add_middleware(\n        CORSMiddleware,\n        allow_origins=["http://127.0.0.1:8787", "http://localhost:8787"],\n        allow_methods=["*"],\n        allow_headers=["*"],\n    )\n'''
          assert s.count(cors) == 1
          s = s.replace(cors, '', 1)

          one(
              r'    @app\.middleware\("http"\)\n    async def auth_middleware\(request: Request, call_next\):\n        started = monotonic\(\)\n',
              '''    @app.middleware("http")\n    async def auth_middleware(request: Request, call_next):\n        prefix = "/api/v1"\n        if request.scope.get("path", "").startswith(prefix + "/"):\n            request.scope["path"] = "/api" + request.scope["path"][len(prefix) :]\n            request.scope["raw_path"] = request.scope["path"].encode("ascii", "ignore")\n        started = monotonic()\n''')

          one(r'    store = DataStore\(data_root\)\n    async_store = AsyncStore\(store\)\n',
              '    store = DataStore(data_root)\n    external_principals = ExternalPrincipalStore(store._connect)\n    async_store = AsyncStore(store)\n')

          one(
              r'        subject = str\(claims\.get\("sub"\).*?        session_token = auth_service\.issue_session\(username, role\)\n',
              '''        if auth_service is None:\n            raise HTTPException(status_code=503, detail="Local authentication is not configured")\n        try:\n            principal = authorize_oidc_principal(oidc_config, claims, external_principals)\n        except (ValueError, ExternalPrincipalAuthorizationError) as exc:\n            raise HTTPException(status_code=403, detail="OIDC identity is not authorized") from exc\n        username = principal.username\n        role = principal.role\n        session_token = auth_service.issue_session(username, role)\n''', flags=re.S)

          marker = '\n    return app\n'
          assert s.count(marker) == 1
          s = s.replace(marker, '''\n    app.add_middleware(\n        CORSMiddleware,\n        allow_origins=["http://127.0.0.1:8787", "http://localhost:8787"],\n        allow_methods=["*"],\n        allow_headers=["*"],\n    )\n\n    return app\n''', 1)
          p.write_text(s, encoding='utf-8', newline='\n')

          Path('tests/test_auth_live_wiring.py').write_text('''import pytest\nfrom fastapi.testclient import TestClient\nfrom starlette.websockets import WebSocketDisconnect\n\nfrom sdpstudio_server.app import create_app\n\n\ndef _clear(monkeypatch):\n    for name in ("SDPSTUDIO_AUTH_TOKEN", "SDPSTUDIO_AUTH_SIGNING_KEY", "SDPSTUDIO_ADMIN_PASSWORD", "SDPSTUDIO_DATABASE_URL", "SDPSTUDIO_OIDC_ISSUER", "SDPSTUDIO_OIDC_CLIENT_ID", "SDPSTUDIO_OIDC_REDIRECT_URI"):\n        monkeypatch.delenv(name, raising=False)\n\n\ndef test_shared_bearer_does_not_gain_admin_role(monkeypatch, tmp_path):\n    _clear(monkeypatch)\n    monkeypatch.setenv("SDPSTUDIO_AUTH_TOKEN", "shared-test-token")\n    client = TestClient(create_app(tmp_path))\n    r = client.get("/api/auth/users", headers={"Authorization": "Bearer shared-test-token"})\n    assert r.status_code == 403\n    assert r.json()["detail"]["code"] == "SDPS-AUTH-ROLE_REQUIRED"\n\n\ndef test_versioned_alias_is_authorized_before_routing(monkeypatch, tmp_path):\n    _clear(monkeypatch)\n    monkeypatch.setenv("SDPSTUDIO_AUTH_TOKEN", "shared-test-token")\n    client = TestClient(create_app(tmp_path))\n    r = client.get("/api/v1/auth/users", headers={"Authorization": "Bearer shared-test-token"})\n    assert r.status_code == 403\n\n\ndef test_cors_preflight_is_outermost(monkeypatch, tmp_path):\n    _clear(monkeypatch)\n    monkeypatch.setenv("SDPSTUDIO_AUTH_TOKEN", "shared-test-token")\n    client = TestClient(create_app(tmp_path))\n    r = client.options("/api/v1/auth/users", headers={"Origin": "http://localhost:8787", "Access-Control-Request-Method": "GET"})\n    assert r.status_code == 200\n    assert r.headers["access-control-allow-origin"] == "http://localhost:8787"\n\n\ndef test_local_admin_session_satisfies_admin_role(monkeypatch, tmp_path):\n    _clear(monkeypatch)\n    monkeypatch.setenv("SDPSTUDIO_AUTH_SIGNING_KEY", "live-wiring-signing-key")\n    monkeypatch.setenv("SDPSTUDIO_ADMIN_PASSWORD", "admin-test-password")\n    client = TestClient(create_app(tmp_path))\n    assert client.post("/api/auth/login", json={"username": "admin", "password": "admin-test-password"}).status_code == 200\n    assert client.get("/api/auth/users").status_code == 200\n\n\ndef test_websocket_requires_auth_with_local_auth(monkeypatch, tmp_path):\n    _clear(monkeypatch)\n    monkeypatch.setenv("SDPSTUDIO_AUTH_SIGNING_KEY", "live-wiring-signing-key")\n    monkeypatch.setenv("SDPSTUDIO_ADMIN_PASSWORD", "admin-test-password")\n    client = TestClient(create_app(tmp_path))\n    with pytest.raises(WebSocketDisconnect) as exc:\n        with client.websocket_connect("/ws/runs/missing", subprotocols=["sdpstudio.v1"]):\n            pass\n    assert exc.value.code == 4401\n''', encoding='utf-8', newline='\n')
      - name: Commit candidate tree
        run: |
          rm .github/workflows/scratch-auth-live-wiring.yml .github/workflows/scratch-auth-live-wiring-v2.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "security: wire live authorization boundaries"
          git push origin HEAD:scratch/2026-09-12-auth-live-wiring
