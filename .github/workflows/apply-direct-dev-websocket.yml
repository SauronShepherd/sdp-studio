name: Apply direct dev websocket

on:
  push:
    branches:
      - autopilot-pytest-hang-20260902

permissions:
  contents: write

jobs:
  patch-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply deterministic client patch
        run: python .github/scripts/patch_direct_dev_websocket.py
      - name: Verify direct dev socket routing
        run: |
          grep -q 'window.location.hostname}:8788' web/src/main.tsx
          grep -q 'import.meta.env.DEV ? "ws:"' web/src/main.tsx
      - name: Commit product patch and remove helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/src/main.tsx
          git rm .github/scripts/patch_direct_dev_websocket.py .github/workflows/apply-direct-dev-websocket.yml
          git commit -m 'fix: connect dev collaboration directly to backend'
          git push origin HEAD:autopilot-pytest-hang-20260902
