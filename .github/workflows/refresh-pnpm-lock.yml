name: Refresh pinned pnpm lock

on:
  push:
    branches:
      - autopilot-pytest-hang-20260902

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Regenerate lockfile from pinned workspace metadata
        run: pnpm install --lockfile-only
      - name: Validate frozen install and production audit
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --prod
      - name: Commit lockfile if changed
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          git commit -m 'fix: lock patched DOMPurify with pinned pnpm'
          git push origin HEAD:autopilot-pytest-hang-20260902
