name: Refresh reviewed pnpm lock

on:
  push:
    branches:
      - autopilot-dompurify-20260902

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Regenerate lockfile from declared override
        run: pnpm install --lockfile-only
      - name: Verify patched dependency resolution
        run: |
          grep -q '^  dompurify: 3.4.14$' pnpm-lock.yaml
          grep -q '^  dompurify@3.4.14:$' pnpm-lock.yaml
          ! grep -q '^  dompurify@3.4.8:$' pnpm-lock.yaml
      - name: Commit lockfile if changed
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo 'Lockfile already materialized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          git commit -m 'fix: lock patched DOMPurify resolution'
          git push origin HEAD:autopilot-dompurify-20260902
