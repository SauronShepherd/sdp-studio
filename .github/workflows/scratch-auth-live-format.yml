name: scratch-auth-live-format

on:
  push:
    branches: [scratch/2026-09-12-auth-live-format]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install ruff==0.16.7
      - name: Format only changed auth files
        run: |
          ruff format python/sdpstudio_server/app.py tests/test_auth_live_wiring.py
          ruff check python/sdpstudio_server/app.py tests/test_auth_live_wiring.py
          ruff format --check python/sdpstudio_server/app.py tests/test_auth_live_wiring.py
      - name: Commit candidate
        run: |
          rm .github/workflows/scratch-auth-live-format.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "style: format auth live wiring"
          git push origin HEAD:scratch/2026-09-12-auth-live-format
