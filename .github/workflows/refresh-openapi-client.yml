name: Refresh generated OpenAPI client

on:
  push:
    branches:
      - autopilot-pytest-hang-20260902

permissions:
  contents: write

jobs:
  refresh-openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Generate client from application schema
        run: python scripts/openapi_client.py --from-app --output web/src/openapi.generated.ts
      - name: Verify deterministic generation
        run: python scripts/openapi_client.py --from-app --output web/src/openapi.generated.ts --check
      - name: Commit generated client if changed
        run: |
          if git diff --quiet -- web/src/openapi.generated.ts; then
            echo 'Generated client already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/src/openapi.generated.ts
          git commit -m 'fix: refresh generated OpenAPI client'
          git push origin HEAD:autopilot-pytest-hang-20260902
