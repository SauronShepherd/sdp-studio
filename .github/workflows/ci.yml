name: CI
on:
  push:
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - run: ruff check python tests
      - run: ruff format --check --exclude tests/golden python tests
      - run: mypy
      - run: pytest -vv
      - name: Verify Alembic persistence migrations
        run: pytest -q tests/test_migrations.py
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sdpstudio/web lint
      - run: pnpm --filter @sdpstudio/web test
      - run: pnpm --filter @sdpstudio/web typecheck
      - run: pnpm --filter @sdpstudio/web build
  browser-e2e:
    runs-on: ubuntu-latest
    needs: [python, web]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: pip install -e .
      - run: pnpm --filter @sdpstudio/web exec playwright install --with-deps chromium
      - run: pnpm --filter @sdpstudio/web test:e2e
      - name: Upload Playwright failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-evidence
          path: |
            web/test-results
            web/playwright-report
          if-no-files-found: warn
          retention-days: 7
  package:
    runs-on: ubuntu-latest
    needs: [python, web]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build setuptools wheel -e .
      - run: python -m build --wheel --sdist --no-isolation
      - run: python scripts/release_manifest.py --root . --output dist/release-manifest.json dist/*.whl dist/*.tar.gz
      - run: python scripts/sbom.py --output dist/sbom.cdx.json
      - run: python scripts/openapi_client.py --from-app --output web/src/openapi.generated.ts --check
      - run: python scripts/plugin_reference.py --output docs/reference/plugin-sdk.json
      - run: git diff --exit-code -- docs/reference/plugin-sdk.json
      - run: python scripts/license_gate.py dist/sbom.cdx.json
      - name: Build release container targets
        run: |
          docker build --target server -t sdpstudio-server:ci -f deploy/docker/Dockerfile .
          docker build --target worker -t sdpstudio-worker:ci -f deploy/docker/Dockerfile .
          docker build --target runner -t sdpstudio-runner:ci -f deploy/docker/Dockerfile .
          docker image inspect sdpstudio-server:ci sdpstudio-worker:ci sdpstudio-runner:ci
  container-smoke:
    runs-on: ubuntu-latest
    needs: [python, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e .
      - name: Build and healthcheck server container
        run: python scripts/container_smoke.py
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e . pip-audit
      - run: pip-audit
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod
  performance:
    runs-on: ubuntu-latest
    needs: [python]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e .
      - run: PYTHONPATH=python python scripts/benchmark.py --sizes 25 500 1000 --output dist/benchmark.json
      - uses: actions/upload-artifact@v4
        with:
          name: sdpstudio-benchmark
          path: dist/benchmark.json
  spark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Spark integration dependencies
        run: pip install -e '.[pipelines]' pytest
      - name: Run local Spark preview smoke
        run: PYTHONPATH=python spark-submit --master local[2] tests/spark_preview_smoke.py
      - name: Run Spark 4.2 Auto CDC qualification
        run: PYTHONPATH=python python tests/spark_auto_cdc_smoke.py
