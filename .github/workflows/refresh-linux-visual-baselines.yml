name: Refresh Linux visual baselines

on:
  workflow_dispatch:
  push:
    branches:
      - autopilot-pytest-hang-20260902
    paths:
      - .github/workflows/refresh-linux-visual-baselines.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: pip install -e .
      - run: pnpm --filter @sdpstudio/web exec playwright install --with-deps chromium
      - name: Generate Linux Chromium baselines
        run: pnpm --filter @sdpstudio/web exec playwright test e2e/studio.visual.spec.ts --update-snapshots
      - name: Commit exact Linux baselines
        shell: bash
        run: |
          set -euo pipefail
          git add \
            web/e2e/studio.visual.spec.ts-snapshots/studio-desktop-chromium-linux.png \
            web/e2e/studio.visual.spec.ts-snapshots/studio-python-inspector-chromium-linux.png \
            web/e2e/studio.visual.spec.ts-snapshots/studio-mobile-chromium-linux.png
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "test: add Linux Chromium visual baselines"
          git push
